<ng-container *transloco="let t">
    <div id="main-container" (keyup.enter)="sendResetPasswordEmail()">
        <mat-card id="main-card">
            <h1>Mot de passe oublié ?</h1>
            <p>Si vous avez déjà un compte, vous recevrez un courriel pour réinitialiser votre mot de passe.</p>
            <div id="form">
                <mat-form-field id="email">
                    <mat-label>Courriel</mat-label>
                    <input matInput placeholder="" [(ngModel)]="email" id="email-input" autofocus cdkFocusInitial />
                </mat-form-field>
            </div>
            <button mat-raised-button color="primary" (click)="sendResetPasswordEmail()">Réinitialiser le mot de passe</button>
            <button mat-raised-button routerLink="/login" color="basic">Retourner à la page de connexion</button>
        </mat-card>
    </div>
</ng-container>
