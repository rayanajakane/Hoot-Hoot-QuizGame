<ng-container *transloco="let t">
    <div
        id="players-main-container"
        *ngIf="
            this.matchContextService.getContext() === context.HostView ||
            (this.matchContextService.getContext() !== context.HostView && this.matchContextService.getContext() === context.RandomMode)
        "
    >
        <h2>{{ t('players-list.players') }}</h2>
        <div *ngIf="this.matchContextService.getContext() === context.HostView">
            <div *ngFor="let player of this.players | sortPlayers: 'score' : 'descending'" class="player-card">
                <p [ngClass]="[player.isPlaying ? '' : 'inactive-player']">{{ player.username }}</p>
                <div class="player-performance">
                    <p>{{ player.score }} pts</p>
                    <p>({{ player.bonusCount }}✨)</p>
                    <span *ngIf="player.username === this.matchRoomService.cheaterPlayer?.username" class="cheater-tag"><p>{{t('cheater-mode.cheater')}}</p></span>
                </div>
            </div>
        </div>
    </div>
