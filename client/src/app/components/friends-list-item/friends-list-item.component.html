<li class="user-item">
    <div class="user-info">
        <img class="avatar" [src]="user.photoUrl ? user.photoUrl : defaultAvatar" alt="Avatar" />
        <span class="username">{{ user.name }}</span>
        <span class="status-indicator" [ngClass]="{ online: user.isOnline, offline: !user.isOnline }"></span>
    </div>
    <ng-container [ngSwitch]="true">
        <button *ngSwitchCase="isFriend" mat-raised-button color="basic" disabled>✅ Amis</button>
        <ng-container *ngSwitchCase="isRequestPending">
            <div class="action-buttons">
                <button mat-raised-button color="accent" (click)="onAccept()">Accepter</button>
                <button mat-raised-button color="warn" (click)="onReject()">Refuser</button>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="isRequestSent">
            <div class="action-buttons">
                <button mat-raised-button color="warn" disabled>⏳ Demande envoyée</button>
                <button mat-raised-button color="accent" (click)="onCancel()">Annuler</button>
            </div>
        </ng-container>
        <button *ngSwitchDefault mat-raised-button color="primary" (click)="onSend()" [disabled]="!isEligible">Ajouter</button>
    </ng-container>
</li>
