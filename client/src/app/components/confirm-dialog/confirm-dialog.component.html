<ng-container *transloco="let t">
    <h1 mat-dialog-title>
        <mat-icon>{{ data.icon }}</mat-icon> {{ t(data.title) }}
    </h1>
    <div mat-dialog-content>{{ t(data.text) }}</div>
    <div mat-dialog-actions align="end">
        <button mat-button (click)="onCancel()">{{ t('common.cancel') }}</button>
        <button mat-raised-button cdkFocusInitial color="primary" (click)="onConfirm()">{{ t('common.yes') }}</button>
    </div>
</ng-container>
