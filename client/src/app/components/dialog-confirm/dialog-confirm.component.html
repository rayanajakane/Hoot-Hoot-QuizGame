<h1 mat-dialog-title>
    <mat-icon>{{ data.icon }}</mat-icon> {{ data.title }}
</h1>
<div mat-dialog-content>{{ data.text }}</div>
<div mat-dialog-actions align="end" *transloco="let t">
    <button mat-button (click)="onCancel()">{{ t('common.no') }}</button>
    <button mat-raised-button cdkFocusInitial color="primary" (click)="onConfirm()">{{ t('common.yes') }}</button>
</div>
