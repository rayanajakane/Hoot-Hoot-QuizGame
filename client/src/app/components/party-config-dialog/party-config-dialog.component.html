<ng-container *transloco="let t">
    <h1 mat-dialog-title><mat-icon>settings</mat-icon>{{ t('match-config.title-label') }}</h1>
    <div mat-dialog-content>
        <div class="config-section">
            <mat-slide-toggle [(ngModel)]="partyConfig.isFriendsOnly">{{ t('match-config.friends-label') }}</mat-slide-toggle>
            <p class="helper-text" *ngIf="partyConfig.isFriendsOnly">{{ t('match-config.friends-description') }}</p>
        </div>

        <div class="config-section">
            <mat-slide-toggle [(ngModel)]="partyConfig.isEntryFeeRequired">{{ t('match-config.fee-section-label') }}</mat-slide-toggle>

            <div *ngIf="partyConfig.isEntryFeeRequired" class="fee-section">
                <mat-form-field appearance="outline">
                    <mat-label>{{ t('match-config.fee-label') }}</mat-label>
                    <input matInput type="number" [(ngModel)]="partyConfig.entryFeeAmount" min="0" />
                    <mat-icon matSuffix>attach_money</mat-icon>
                </mat-form-field>
                <p class="helper-text">{{ t('match-config.fee-description') }}</p>
            </div>
        </div>
    </div>
    <div mat-dialog-actions align="end">
        <button mat-button (click)="onCancel()">{{ t('match-config.cancel') }}</button>
        <button mat-raised-button cdkFocusInitial color="primary" (click)="onConfirm()">{{ t('match-config.confirm') }}</button>
    </div>
</ng-container>
